  <style
     id="style1">.pl1123__ring {
            animation: ringA 2s linear infinite;
        }

        .pl1123__ring--a {
            stroke: currentColor;
        }

        .pl1123__ring--b {
            animation-name: ringB;
            stroke: currentColor;
        }

        .pl1123__ring--c {
            animation-name: ringC;
            stroke: currentColor;
        }

        .pl1123__ring--d {
            animation-name: ringD;
            stroke: currentColor;
        }

        /* Animations */
        @keyframes ringA {

            from,
            4% {
                stroke-dasharray: 0 660;
                stroke-width: 20;
                stroke-dashoffset: -330;
            }

            12% {
                stroke-dasharray: 60 600;
                stroke-width: 30;
