name: Generate Sitemap

on:
  push:
    branches:
      - main # Change this to your default branch if it is 'master'

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your repository content
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Run the sitemap generator
      - name: Generate sitemap
        uses: guimauvedigital/generate-sitemap@v1
        with:
          base_url: "https://jangarit.github.io" # Replace with your actual domain
          input_dir: "."                      # Optional: Folder to scan (default is root)
          output_path: "sitemap.xml"          # Optional: Where to save it (default is root)

      # Step 3: Commit and push the generated sitemap back to the repo
      - name: Commit and Push Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap.xml [skip ci]" || echo "No changes to commit"
          git push
